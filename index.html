<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TravelGoPH</title>
  <style>
    /* Reset default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000; /* pure black */
    }

    header {
      position: sticky;
      top: 0;
      background-color: #000000; /* pure black */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease-in-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffffff; /* white text */
      cursor: pointer;
      user-select: none;
    }

    .logo img {
      width: 30px;
      height: 30px;
      transition: transform 0.6s ease;
    }

    /* Roll animation triggered by adding this class */
    .roll {
      animation: rollAnimation 0.6s forwards;
    }

    @keyframes rollAnimation {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    nav ul li a {
      text-decoration: none;
      color: #ffffff; /* white text */
      font-weight: 500;
      transition: color 0.3s;
      position: relative;
    }

    nav ul li a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      background-color: #007BFF; /* blue underline on hover */
      bottom: -4px;
      left: 0;
      transition: width 0.3s ease;
    }

    nav ul li a:hover::after {
      width: 100%;
    }

    nav ul li a:hover {
      color: #007BFF; /* text changes to blue on hover */
    }

    /* Mobile Navigation Toggle */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .menu-toggle div {
      width: 25px;
      height: 3px;
      background-color: #ffffff; /* white hamburger bars */
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      nav ul {
        position: absolute;
        top: 70px;
        right: 0;
        background-color: #000000; /* mobile menu background black */
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 1rem 0;
        display: none;
      }

      nav ul.active {
        display: flex;
      }

      .menu-toggle {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" id="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" alt="Travel Logo" id="logo-img" />
      TravelGoPH
    </div>
    <div class="menu-toggle" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <nav>
      <ul id="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#places">Top Places</a></li>
        <li><a href="#tours">Tours</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <script>
    function toggleMenu() {
      const navLinks = document.getElementById('nav-links');
      navLinks.classList.toggle('active');
    }

    const logoImg = document.getElementById('logo-img');
    logoImg.addEventListener('mouseenter', () => {
      if (logoImg.classList.contains('roll')) return;

      logoImg.classList.add('roll');
      logoImg.addEventListener('animationend', () => {
        logoImg.classList.remove('roll');
      }, { once: true });
    });
  </script>

</body>
</html>
